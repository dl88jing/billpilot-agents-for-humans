[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "billpilot"
version = "0.2.0"
description = "BillPilot — multi-agent Everyday Agent swarm for household bills (AWS Agents for Humans)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "BillPilot Contributors" }]
dependencies = [
  "strands-agents>=1.0.0",
  "strands-agents-tools>=0.2.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
bedrock = ["boto3>=1.34.0"]

[project.scripts]
billpilot-demo = "billpilot.demo:main"
billpilot-verify-ledger = "billpilot.verify_ledger:main"

[tool.setuptools.packages.find]
include = ["billpilot*"]

[tool.setuptools.package-data]
billpilot = ["py.typed"]
