[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "billpilot"
version = "0.1.0"
description = "BillPilot — autonomous everyday agent for household bill management (AWS Agents for Humans)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "BillPilot Contributors" }]
dependencies = [
  "strands-agents>=1.0.0",
  "strands-agents-tools>=0.2.0",
]

[project.optional-dependencies]
bedrock = ["boto3>=1.34.0"]

[project.scripts]
billpilot-demo = "billpilot.demo:main"

[tool.setuptools.packages.find]
include = ["billpilot*"]
