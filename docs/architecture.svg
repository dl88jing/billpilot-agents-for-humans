<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640">
  <rect width="1100" height="640" fill="#0b1220"/>
  <text x="36" y="42" fill="#e8eefc" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="700">BillPilot — Multi-Agent Architecture</text>
  <text x="36" y="68" fill="#9db0d0" font-family="Helvetica,Arial,sans-serif" font-size="13">Strands Agents SDK swarm · Policy engine · Hash-chained audit ledger · AWS Agents for Humans</text>

  <!-- Fixtures -->
  <rect x="36" y="100" width="180" height="88" rx="12" fill="#1a2744" stroke="#6b8cff"/>
  <text x="52" y="132" fill="#e8eefc" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="700">Fixtures / Signals</text>
  <text x="52" y="154" fill="#9db0d0" font-family="Helvetica,Arial,sans-serif" font-size="12">inbox · calendar · bills</text>
  <text x="52" y="172" fill="#9db0d0" font-family="Helvetica,Arial,sans-serif" font-size="12">accounts · household</text>

  <!-- Intake -->
  <rect x="250" y="100" width="170" height="88" rx="12" fill="#1a2744" stroke="#4f7cff"/>
  <text x="266" y="132" fill="#e8eefc" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="700">Intake Agent</text>
  <text x="266" y="154" fill="#9db0d0" font-family="Helvetica,Arial,sans-serif" font-size="12">list_inbox · parse_email</text>
  <text x="266" y="172" fill="#9db0d0" font-family="Helvetica,Arial,sans-serif" font-size="12">calendar_dues</text>

  <!-- Risk -->
  <rect x="454" y="100" width="170" height="88" rx="12" fill="#1a2744" stroke="#4f7cff"/>
  <text x="470" y="132" fill="#e8eefc" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="700">Risk Agent</text>
  <text x="470" y="154" fill="#9db0d0" font-family="Helvetica,Arial,sans-serif" font-size="12">check_anomaly</text>
  <text x="470" y="172" fill="#9db0d0" font-family="Helvetica,Arial,sans-serif" font-size="12">detect_duplicates</text>

  <!-- Policy -->
  <rect x="658" y="100" width="180" height="88" rx="12" fill="#2a2140" stroke="#c79bff"/>
  <text x="674" y="132" fill="#e8eefc" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="700">Policy Engine</text>
  <text x="674" y="154" fill="#9db0d0" font-family="Helvetica,Arial,sans-serif" font-size="12">AUTO vs HUMAN</text>
  <text x="674" y="172" fill="#9db0d0" font-family="Helvetica,Arial,sans-serif" font-size="12">policies/default.yaml</text>

  <!-- Orchestrator -->
  <rect x="870" y="100" width="190" height="88" rx="12" fill="#1a2744" stroke="#ffd166"/>
  <text x="886" y="132" fill="#e8eefc" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="700">Orchestrator</text>
  <text x="886" y="154" fill="#9db0d0" font-family="Helvetica,Arial,sans-serif" font-size="12">pipeline + swarm build</text>
  <text x="886" y="172" fill="#9db0d0" font-family="Helvetica,Arial,sans-serif" font-size="12">DemoModel / Bedrock</text>

  <!-- arrows top -->
  <path d="M216 144 H250" stroke="#6b8cff" stroke-width="3" fill="none"/>
  <path d="M420 144 H454" stroke="#4f7cff" stroke-width="3" fill="none"/>
  <path d="M624 144 H658" stroke="#4f7cff" stroke-width="3" fill="none"/>
  <path d="M838 144 H870" stroke="#c79bff" stroke-width="3" fill="none"/>

  <!-- Treasurer -->
  <rect x="250" y="260" width="260" height="110" rx="12" fill="#1a2744" stroke="#8bd46b"/>
  <text x="270" y="298" fill="#e8eefc" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="700">Treasurer Agent (AUTO)</text>
  <text x="270" y="324" fill="#9db0d0" font-family="Helvetica,Arial,sans-serif" font-size="12">check_funding · queue_payment_prep</text>
  <text x="270" y="344" fill="#9db0d0" font-family="Helvetica,Arial,sans-serif" font-size="12">summarize_payment_queue · list_accounts</text>

  <!-- Comms -->
  <rect x="560" y="260" width="280" height="110" rx="12" fill="#3a1d1d" stroke="#ff7a7a"/>
  <text x="580" y="298" fill="#e8eefc" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="700">Comms Agent</text>
  <text x="580" y="324" fill="#9db0d0" font-family="Helvetica,Arial,sans-serif" font-size="12">AUTO → mark_auto_handled (quiet)</text>
  <text x="580" y="344" fill="#9db0d0" font-family="Helvetica,Arial,sans-serif" font-size="12">HUMAN_REQUIRED → notify_human</text>

  <path d="M748 188 V230 H380 V260" stroke="#8bd46b" stroke-width="3" fill="none"/>
  <path d="M748 188 V230 H700 V260" stroke="#ff7a7a" stroke-width="3" fill="none"/>

  <!-- Ledger -->
  <rect x="250" y="420" width="590" height="100" rx="12" fill="#142033" stroke="#5ad1e8"/>
  <text x="270" y="458" fill="#e8eefc" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="700">Hash-chained Audit Ledger</text>
  <text x="270" y="482" fill="#9db0d0" font-family="Helvetica,Arial,sans-serif" font-size="12">Every tool call → attested event  ·  sha256(prev_hash + payload)</text>
  <text x="270" y="502" fill="#9db0d0" font-family="Helvetica,Arial,sans-serif" font-size="12">python -m billpilot.verify_ledger → PASS + event counts</text>

  <path d="M380 370 V420" stroke="#5ad1e8" stroke-width="3" fill="none"/>
  <path d="M700 370 V420" stroke="#5ad1e8" stroke-width="3" fill="none"/>

  <text x="36" y="560" fill="#9db0d0" font-family="Helvetica,Arial,sans-serif" font-size="12">Scenarios: surprise subscription · duplicate utility · new payee · low balance buffer</text>
  <text x="36" y="582" fill="#9db0d0" font-family="Helvetica,Arial,sans-serif" font-size="12">Offline judges path: pip install -e . &amp;&amp; python -m billpilot.demo (zero AWS keys)</text>
  <text x="36" y="604" fill="#9db0d0" font-family="Helvetica,Arial,sans-serif" font-size="12">Live path: Strands Agent + Amazon BedrockModel · Stretch: Bedrock AgentCore</text>
  <text x="36" y="626" fill="#9db0d0" font-family="Helvetica,Arial,sans-serif" font-size="12">Live product demo: https://billpilot-web.vercel.app</text>
</svg>
